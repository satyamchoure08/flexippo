<script>
/* flexippo.com/name -> that person's page (GitHub Pages shows this file for any address it doesn't have) */
(function () {
  var p = decodeURIComponent(location.pathname).replace(/^\/+|\/+$/g, "").replace(/^@/, "").toLowerCase();
  if (/^[a-z0-9_]{3,20}$/.test(p)) location.replace("/?u=" + p + location.search.replace(/^\?/, "&") + location.hash);
})();
</script>
