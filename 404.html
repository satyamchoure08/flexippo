<script>
/* flexippo.com/name -> that person's page */
(function () {
  var p = decodeURIComponent(location.pathname).replace(/^\/+|\/+$/g, "").replace(/^@/, "").toLowerCase();
  if (/^[a-z0-9_]{3,20}$/.test(p)) location.replace("/?u=" + p + location.hash);
})();
</script>
<style>
:root{color-scheme:dark}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07051a;color:#f6f1ff;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;padding:24px}
b{display:block;font-size:44px;line-height:1;color:#ff2e88;margin-bottom:10px}
a{display:inline-block;margin-top:18px;padding:12px 20px;border-radius:999px;background:linear-gradient(135deg,#ff2e88,#8b5cff);color:#fff;font-weight:800;text-decoration:none}
p{margin:0;color:#a99fd3}
</style>
</head>
